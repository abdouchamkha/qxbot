name: qxbot_app
description: QXBot - Quotex signal trading bot
publish_to: none
version: 1.3.0+4
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  unorm_dart: ^0.3.0
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  flutter_foreground_task: ^11.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
